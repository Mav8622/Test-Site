<!DOCTYPE html>
<html>
<head>
    <title>BANANA</title>
</head>
<body style="text-align: center; font-family: sans-serif; margin: 0; padding: 20px; background-color: #5FDFE8;">

    <!-- Properly Center-Aligned & Capitalized Headers -->
    <h1 style="color: red;">Hi Patootie</h1>
    <h2 style="color: violet;">What's Up.</h2>

    <!-- Line breaks to push the button down -->
    <br><br><br>

    <!-- Capitalized Open button with an onclick function -->
    <button id="openFlowersButton" type="button" onclick="showFlowers()" style="background-color: #ff6b6b; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 0 auto; display: inline-block;">
        CLICK ME
    </button>

    <!-- NEW MUSIC SECTION: Placed directly below the CLICK ME button, centered -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px;">
        <button id="musicTriggerBtn" onclick="toggleMusicView(true)" style="background-color: #FFDE4D; color: #1a1a1a; font-size: 16px; font-weight: bold; font-family: sans-serif; padding: 12px 24px; border: 1px solid #c7ae3c; border-radius: 4px; cursor: pointer; margin: 0 auto;">
            Today's song
        </button>

    <div id="playlistRevealBox" style="display: none; flex-direction: column; align-items: center; margin: 10px auto 0 auto;">
            <a href="https://www.youtube.com/watch?v=RJD1fQ15I9Y&list=RDRJD1fQ15I9Y&start_radio=1" target="_blank" rel="noopener noreferrer" style="color: #FFDE4D; text-decoration: underline; font-weight: bold; font-family: sans-serif;">Listen to Today's Song</a>

            </a>
            <button onclick="toggleMusicView(false)" style="background-color: yellow; color: black; font-family: sans-serif; padding: 6px 16px; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; margin: 0 auto;">
                Close
            </button>
        </div>
    </div>

    <br><br>

    <!-- Capitalized Custom Message (hidden by default) -->
    <p id="customMessage" style="display: none; font-size: 24px; color: #F041BD; font-weight: bold; font-style: italic; margin-bottom: 10px;">
        FOR BANANA
    </p>

    <!-- Center-Aligned Image Container (hidden by default) -->
    <div style="display: flex; justify-content: center;">
        <!-- Secure Direct Repository Link -->
        <img id="flowerImage" src="bouquet.jpg" alt="Pink and White Tulips Bouquet" style="display: none; max-width: 90%; max-height: 500px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
    </div>

    <br><br>

    <!-- Capitalized Close Button (hidden by default) -->
    <button id="closeButton" type="button" onclick="hideFlowers()" style="display: none; background-color: #ff6b6b; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 0 auto;">
        CLOSE
    </button>

    <!-- The JavaScript Logic -->
    <script>
    function showFlowers() {
        document.getElementById("customMessage").style.display = "block"; // Shows the message
        document.getElementById("flowerImage").style.display = "block";    // Shows the image
        document.getElementById("closeButton").style.display = "block";   // Shows the close button
    }

    function hideFlowers() {
        document.getElementById("customMessage").style.display = "none";  // Hides the message
        document.getElementById("flowerImage").style.display = "none";     // Hides the image
        document.getElementById("closeButton").style.display = "none";    // Hides the close button
    }

    function toggleMusicView(showPlaylist) {
        var mainBtn = document.getElementById('musicTriggerBtn');
        var revealBox = document.getElementById('playlistRevealBox');
        if (showPlaylist) {
            mainBtn.style.display = 'none';
            revealBox.style.display = 'flex';
        } else {
            revealBox.style.display = 'none';
            mainBtn.style.display = 'inline-block';
        }
    }
    </script>
    
</body>
</html>
